name: build-hosts
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install build deps
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa
          sudo apt update
          sudo apt install \
            python3.14 \
            python3.14-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev
      - name: Check Python version
        run: |
          python --version
          python3 --version
          python3.14 --version
      - name: Build dependencies
        run: ./build_deps.sh
      - name: Build app
        run: ./build.sh
      - name: Debug with tmate
        uses: mxschmitt/action-tmate@v3

